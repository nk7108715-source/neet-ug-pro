<!DOCTYPE html>
<html lang="en" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET UG Pro - Ultimate Exam Preparation</title>
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="./manifest.json">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col pb-20 transition-colors duration-200" id="body-theme">

    <!-- Top Header -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" onclick="router('home')">
                <i class="fa-solid fa-graduation-cap text-2xl"></i>
                <span class="text-xl font-bold tracking-wide">NEET UG Pro</span>
            </div>
            
            <div class="flex items-center space-x-4">
                <button onclick="openNotifications()" class="relative text-white hover:text-indigo-200 transition">
                    <i class="fa-solid fa-bell text-lg"></i>
                    <span class="absolute -top-1 -right-1 bg-amber-400 text-slate-900 text-[10px] font-bold px-1 rounded-full">2</span>
                </button>

                <div class="relative">
                    <button onclick="toggleMenu()" class="text-white hover:text-indigo-200 p-1 transition">
                        <i class="fa-solid fa-ellipsis-vertical text-xl"></i>
                    </button>
                    <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-52 bg-white text-slate-800 rounded-xl shadow-xl border border-slate-200 py-2 z-50">
                        <button onclick="router('profile'); toggleMenu();" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-100 flex items-center space-x-2"><i class="fa-solid fa-user w-5 text-indigo-600"></i><span>Profile / Auth</span></button>
                        <button onclick="toggleDarkMode(); toggleMenu();" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-100 flex items-center space-x-2"><i class="fa-solid fa-moon w-5 text-indigo-600"></i><span id="dark-mode-text">Night Mode</span></button>
                        <button onclick="router('about'); toggleMenu();" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-100 flex items-center space-x-2"><i class="fa-solid fa-info-circle w-5 text-indigo-600"></i><span>About App</span></button>
                        <button onclick="promptAdminLogin(); toggleMenu();" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-100 flex items-center space-x-2 border-t border-slate-100"><i class="fa-solid fa-shield-halved w-5 text-amber-600"></i><span>Admin Access</span></button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        
        <!-- Home View -->
        <div id="view-home" class="space-y-8">
            <div class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white rounded-2xl p-8 shadow-xl flex flex-col md:flex-row justify-between items-center">
                <div class="space-y-4 max-w-xl">
                    <span class="bg-indigo-500 text-indigo-100 text-xs px-3 py-1 rounded-full uppercase tracking-wider font-semibold">Updated for 2026</span>
                    <h1 class="text-3xl md:text-5xl font-extrabold leading-tight">Crack NEET UG with Precision</h1>
                    <p class="text-indigo-100 text-sm md:text-base">Access comprehensive PYQs, Free Mind Maps, and Chapterwise tests.</p>
                    <div class="flex space-x-4 pt-2">
                        <button onclick="router('pyqs')" class="bg-amber-400 text-slate-900 font-bold px-6 py-3 rounded-xl shadow hover:bg-amber-300 transition">Explore PYQs</button>
                        <button onclick="router('pro')" class="border border-white text-white font-semibold px-6 py-3 rounded-xl hover:bg-white/10 transition">Pro Plans</button>
                    </div>
                </div>
                <div class="mt-6 md:mt-0 text-indigo-200 text-8xl">
                    <i class="fa-solid fa-book-medical"></i>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div onclick="router('pyqs')" class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 hover:border-indigo-500 cursor-pointer transition text-center space-y-2">
                    <div class="text-indigo-600 text-3xl"><i class="fa-solid fa-file-lines"></i></div>
                    <h3 class="font-bold text-lg">All PYQs</h3>
                    <p class="text-xs text-slate-500">100% Free Access</p>
                </div>
                <div onclick="router('chapterwise')" class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 hover:border-indigo-500 cursor-pointer transition text-center space-y-2">
                    <div class="text-emerald-600 text-3xl"><i class="fa-solid fa-list-check"></i></div>
                    <h3 class="font-bold text-lg">Chapterwise</h3>
                    <p class="text-xs text-slate-500">First 3 Chapters Free</p>
                </div>
                <div onclick="router('mindmaps')" class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 hover:border-indigo-500 cursor-pointer transition text-center space-y-2">
                    <div class="text-green-600 text-3xl"><i class="fa-solid fa-network-wired"></i></div>
                    <h3 class="font-bold text-lg">Mind Maps</h3>
                    <p class="text-xs text-slate-500">Visual Flowcharts</p>
                </div>
                <div onclick="router('video')" class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm border border-slate-200
